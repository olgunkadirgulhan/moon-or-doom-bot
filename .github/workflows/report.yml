name: Otomatik rapor

on:
  schedule:
    # Günde 6 rapor, 4 saatte bir: UTC 00,04,08,12,16,20 → İstanbul 03, 07, 11, 15, 19, 23
    - cron: "0 */4 * * *"
    # Raporların arası (UTC 02,06,…,22 → İstanbul 05, 09, 13, 17, 21, 01): sadece işlem takibi (doldu/TP1/stop/süre)
    - cron: "0 2-22/4 * * *"
    # Her gün 17:00 UTC → İstanbul 20:00: günlük sonuç (+ cumartesi haftalık, ayın son günü aylık).
    # Tek zamanlama: aynı anda birden çok çalışma kuyruğa girip birbirini iptal etmesin.
    - cron: "0 17 * * *"
    # Her gün 00:10 UTC (günlük mum kapandıktan sonra) → Trend Kırılımı sinyalleri + iz süren stoplar
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "report = rapor · monitor = işlem takibi · results = bugünün sonuçları · daily/weekly/monthly = tek sonuç"
        type: choice
        options: [report, monitor, results, trend, daily, weekly, monthly]
        default: report

permissions:
  contents: write  # tracking/*.csv dosyalarını repoya kaydetmek için

concurrency:
  group: tracking  # iki çalışma aynı anda tahmin dosyasına yazmasın
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MODE: >-
        ${{ github.event.inputs.mode
            || (github.event.schedule == '0 17 * * *' && 'results')
            || (github.event.schedule == '0 2-22/4 * * *' && 'monitor')
            || (github.event.schedule == '10 0 * * *' && 'trend')
            || 'report' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m bot.oneshot "$MODE"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_ID: ${{ secrets.ALLOWED_CHAT_ID }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          EXCHANGE: binance
      - name: Tahmin kayıtlarını repoya yaz
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracking/
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "tracking: $MODE $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
